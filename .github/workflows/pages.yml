name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Blog posts live in a separate content bucket, so rebuild on a schedule and
  # on demand (repository_dispatch) to pick up new posts.
  schedule:
    - cron: '17 */6 * * *'
  repository_dispatch:
    types: [blog-content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: HUSKY=0 npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm run build
        env:
          BLOG_CONTENT_URL: ${{ vars.BLOG_CONTENT_URL }}
          NEXT_PUBLIC_APP_URL: https://qvanle.rotexai.com
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
