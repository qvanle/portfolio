# github.com has been intermittently unreachable (connection timeouts, ~15-35%
# failure rate) from CI nodes across multiple hosts/providers - a regional
# network routing issue upstream of us. The default clone plugin settings
# aren't visibly retrying on this failure mode in practice, so raise attempts/
# backoff explicitly.
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      backoff: 10s
      attempts: 8

steps:
  - name: verify
    image: node:20-bookworm-slim
    commands:
      - HUSKY=0 npm ci --legacy-peer-deps
      - npm run check
      - npm run build
    when:
      event:
        - push
        - pull_request

  - name: publish-image
    image: gcr.io/kaniko-project/executor:debug
    entrypoint:
      - /busybox/sh
      - -c
      - |
        set -euo pipefail
        : "$${REGISTRY_ENDPOINT:?REGISTRY_ENDPOINT is not set}"

        workspace_dir="$${CI_WORKSPACE:-$(pwd)}"
        dockerfile="$workspace_dir/docker/Dockerfile"
        if [ ! -f "$dockerfile" ]; then
          echo "Dockerfile not found at $dockerfile" >&2
          exit 1
        fi

        /kaniko/executor \
          --context "dir://$workspace_dir" \
          --dockerfile "$dockerfile" \
          --destination "$REGISTRY_ENDPOINT/web-qvanle:$CI_COMMIT_SHA" \
          --destination "$REGISTRY_ENDPOINT/web-qvanle:main" \
          --digest-file .image-digest \
          --target prod \
          --cache=true \
          --cache-repo "$REGISTRY_ENDPOINT/cache/web-qvanle" \
          --cache-ttl=168h \
          --insecure
    depends_on:
      - verify
    when:
      branch: main
      event:
        - push

  - name: update-manifest
    image: alpine/git:2.49.1
    depends_on:
      - publish-image
    environment:
      GITOPS_TOKEN:
        from_secret: GITOPS_TOKEN
    commands:
      - |
        set -eu
        : "$${GITOPS_TOKEN:?GITOPS_TOKEN is not set}"

        # github.com has been intermittently unreachable (connection timeouts) from
        # our CI nodes regardless of which one runs the job - a regional routing
        # issue upstream of us, not something a config change here can fix. Retry
        # with backoff so a transient blip doesn't fail the whole pipeline.
        retry() {
          attempt=1
          max_attempts=5
          delay=5
          while ! "$@"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Command failed after $attempt attempts: $*" >&2
              return 1
            fi
            echo "Attempt $attempt/$max_attempts failed: $*  (retrying in $${delay}s)" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
        }

        workspace_dir="$(pwd)"
        workdir="$(mktemp -d)"
        trap 'rm -rf "$workdir"' EXIT

        clone_manifest() {
          rm -rf "$workdir/manifest"
          git clone \
            "https://x-access-token:$${GITOPS_TOKEN}@github.com/rotexai/manifest.git" \
            "$workdir/manifest"
        }
        retry clone_manifest
        cd "$workdir/manifest"

        git config user.name "woodpecker"
        git config user.email "woodpecker@rotexai.com"

        image_digest_file="$workspace_dir/.image-digest"
        if [ ! -f "$image_digest_file" ]; then
          echo "Image digest file not found" >&2
          exit 1
        fi
        image_digest="$(tr -d '\r\n' < "$image_digest_file")"
        if [ -z "$image_digest" ]; then
          echo "Image digest file is empty" >&2
          exit 1
        fi

        set_image_digest() {
          file="$1"
          image_name="$2"
          digest="$3"
          tmp="$(mktemp)"
          awk -v image_name="$image_name" -v digest="$digest" '
            {
              line = $0
              match(line, /^[[:space:]]*/)
              indent = substr(line, RSTART, RLENGTH)
              stripped = substr(line, RLENGTH + 1)

              if (in_target && length(indent) <= target_indent && stripped !~ /^$/) {
                in_target = 0
              }

              if (stripped ~ /^- name:[[:space:]]*/) {
                entry_name = stripped
                sub(/^- name:[[:space:]]*/, "", entry_name)
                if (entry_name == image_name) {
                  in_target = 1
                  target_indent = length(indent)
                  found_target = 1
                  seen_digest = 0
                }
              }

              if (in_target && stripped ~ /^digest:/) {
                if (!seen_digest) {
                  print indent "digest: " digest
                  seen_digest = 1
                }
                next
              }

              print line

              if (in_target && stripped ~ /^newName:/ && !seen_digest) {
                print indent "digest: " digest
                seen_digest = 1
              }
            }
            END {
              if (!found_target || !seen_digest) {
                exit 1
              }
            }
          ' "$file" > "$tmp" && mv "$tmp" "$file"
        }

        manifest_file="./clusters/rum/web-qvanle/kustomization.yaml"
        if [ ! -f "$manifest_file" ]; then
          echo "Could not find web-qvanle kustomization in manifest repo" >&2
          exit 1
        fi

        set_image_digest "$manifest_file" "web-qvanle" "$image_digest"
        if git diff --quiet -- "$manifest_file"; then
          echo "Manifest already at $${image_digest}; nothing to push."
          exit 0
        fi

        git add "$manifest_file"
        git commit -m "chore(web-qvanle): promote $${image_digest}"
        retry git push origin main
    when:
      branch: main
      event:
        - push
